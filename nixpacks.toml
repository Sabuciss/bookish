# šis fails ir vajadzīgs lai railways gadījuma pēc varetu pareizi deployot projektu 
[phases.build]
cmds = ["npm ci", "npm run build"]

[start]
cmd = "export APP_ENV=\"${APP_ENV:-production}\" APP_DEBUG=\"${APP_DEBUG:-false}\" DB_CONNECTION=\"${DB_CONNECTION:-sqlite}\" DB_DATABASE=\"${DB_DATABASE:-$(pwd)/database/database.sqlite}\" SESSION_DRIVER=\"${SESSION_DRIVER:-database}\" CACHE_STORE=\"${CACHE_STORE:-database}\" QUEUE_CONNECTION=\"${QUEUE_CONNECTION:-database}\"; if [ -z \"$APP_KEY\" ]; then export APP_KEY=\"base64:$(php -r 'echo base64_encode(random_bytes(32));')\"; fi; mkdir -p database; touch \"$DB_DATABASE\"; php artisan optimize:clear && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"
