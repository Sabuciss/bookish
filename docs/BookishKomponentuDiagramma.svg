<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1122" viewBox="0 0 1600 1320" role="img" aria-labelledby="title description">
  <title id="title">Bookish lasīšanas moduļa MVC komponenšu diagramma</title>
  <desc id="description">Detalizēta Bookish lasīšanas moduļa komponenšu diagramma parāda pārlūka pieprasījumu plūsmu caur Laravel maršrutiem uz kontrolieriem, kontrolieru izmantotos modeļus, atgrieztos Blade skatus, modeļu mantošanu, datu attiecības un saglabāšanu datubāzē.</desc>
  <defs>
    <marker id="dep" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#3d5875"/>
    </marker>
    <marker id="gen" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto">
      <path d="M1 1 L15 8 L1 15 Z" fill="#fff" stroke="#3d5875" stroke-width="1.5"/>
    </marker>
    <marker id="db-start" markerWidth="12" markerHeight="12" refX="2" refY="6" orient="auto">
      <path d="M11 1 L1 6 L11 11" fill="none" stroke="#3d5875" stroke-width="1.8"/>
    </marker>
    <marker id="db-end" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11" fill="none" stroke="#3d5875" stroke-width="1.8"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #25364a; }
      .title { font-size: 29px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #586a80; }
      .stereo { font-size: 12px; fill: #68788c; font-style: italic; }
      .heading { font-size: 19px; font-weight: 700; }
      .subheading { font-size: 15px; font-weight: 700; }
      .body { font-size: 13px; }
      .small { font-size: 12px; fill: #586a80; }
      .tiny { font-size: 11px; fill: #586a80; }
      .component { fill: #fff; stroke: #8393a6; stroke-width: 1.8; }
      .framework { fill: #f0f3f7; stroke: #72859a; stroke-width: 2; }
      .view { fill: #f8fbfa; stroke: #819a94; stroke-width: 1.6; }
      .sep { stroke: #d2dae3; stroke-width: 1; }
      .association { fill: none; stroke: #3d5875; stroke-width: 2; }
      .dependency { fill: none; stroke: #3d5875; stroke-width: 2; stroke-dasharray: 7 5; }
      .thin { fill: none; stroke: #8393a6; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1600" height="1200" fill="#f4f6f9"/>
  <text x="48" y="48" class="title">Bookish lasīšanas moduļa komponenšu diagramma</text>
  <text x="48" y="75" class="subtitle">Laravel MVC komponenšu saites starp maršrutiem, modeļiem, kontrolieriem un Blade skatiem</text>

  <!-- External client and routing component. -->
  <path d="M405 140 H470" class="dependency" marker-end="url(#dep)"/>
  <g>
    <rect x="65" y="105" width="340" height="70" rx="7" class="component"/>
    <text x="235" y="132" text-anchor="middle" class="stereo">&lt;&lt;ārējā komponente&gt;&gt;</text>
    <text x="235" y="158" text-anchor="middle" class="heading">Lietotāja tīmekļa pārlūks</text>
    <text x="417" y="131" class="tiny">HTTP</text>
  </g>

  <!-- Routes to controllers: routed HTTP requests. -->
  <path d="M470 175 V205 H50 V560 H270" class="dependency" marker-end="url(#dep)"/>
  <path d="M820 175 V205 H1550 V560 H1385" class="dependency" marker-end="url(#dep)"/>

  <!-- Model inheritance. -->
  <path d="M405 250 H870" class="association" marker-end="url(#gen)"/>
  <text x="635" y="242" text-anchor="middle" class="tiny">Laravel Auth User manto Eloquent Model</text>
  <path d="M255 380 V330 H264 V290" class="association" marker-end="url(#gen)"/>
  <path d="M625 380 V350 H1012 V290" class="association" marker-end="url(#gen)"/>
  <path d="M1010 380 V290" class="association" marker-end="url(#gen)"/>
  <path d="M1395 380 V350 H1012 V290" class="association" marker-end="url(#gen)"/>

  <!-- Model associations. -->
  <path d="M385 430 H495" class="association"/>
  <text x="392" y="420" class="tiny">1</text>
  <text x="471" y="420" class="tiny">0..*</text>
  <text x="407" y="450" class="tiny">user_id</text>

  <path d="M755 430 H870" class="association"/>
  <text x="762" y="420" class="tiny">0..1</text>
  <text x="846" y="420" class="tiny">0..*</text>
  <text x="777" y="450" class="tiny">challenge_id</text>

  <!-- Persistence. -->
  <path d="M1010 290 V315 H1395 V290" class="dependency" marker-start="url(#db-start)" marker-end="url(#db-end)"/>
  <text x="1160" y="310" class="tiny">modeļu datu nolasīšana un saglabāšana</text>

  <!-- Controllers to the models they use, as dashed UML dependencies. -->
  <path d="M300 540 V510 H255 V480" class="dependency" marker-end="url(#dep)"/>
  <path d="M865 615 H835 V500 H80 V430 H125" class="dependency" marker-end="url(#dep)"/>
  <path d="M530 540 V510 H625 V480" class="dependency" marker-end="url(#dep)"/>
  <path d="M530 510 H1395 V480" class="dependency" marker-end="url(#dep)"/>
  <path d="M1125 540 V520 H1010 V480" class="dependency" marker-end="url(#dep)"/>
  <path d="M1125 520 H625 V480" class="dependency" marker-end="url(#dep)"/>

  <!-- One complete controller-to-view dependency per returned Blade view. -->
  <path d="M300 700 V718 H180 V790" class="dependency" marker-end="url(#dep)"/>
  <path d="M430 700 V736 H435 V790" class="dependency" marker-end="url(#dep)"/>
  <path d="M560 700 V754 H690 V790" class="dependency" marker-end="url(#dep)"/>
  <path d="M740 700 V772 H945 V790" class="dependency" marker-end="url(#dep)"/>
  <path d="M1010 700 V736 H1200 V790" class="dependency" marker-end="url(#dep)"/>
  <path d="M1240 700 V754 H1455 V790" class="dependency" marker-end="url(#dep)"/>

  <!-- Framework base components. -->
  <g>
    <rect x="125" y="210" width="280" height="80" rx="7" class="framework"/>
    <rect x="140" y="224" width="17" height="13" fill="#e2e8ef" stroke="#72859a"/>
    <path d="M140 240 H157 M140 244 H157" stroke="#72859a"/>
    <text x="167" y="235" class="stereo">&lt;&lt;Laravel pamatkomponente&gt;&gt;</text>
    <text x="265" y="264" text-anchor="middle" class="heading">Authenticatable</text>
    <text x="265" y="283" text-anchor="middle" class="tiny">autentifikācijas pamatfunkcijas</text>
  </g>
  <g>
    <rect x="870" y="210" width="285" height="80" rx="7" class="framework"/>
    <rect x="885" y="224" width="17" height="13" fill="#e2e8ef" stroke="#72859a"/>
    <path d="M885 240 H902 M885 244 H902" stroke="#72859a"/>
    <text x="912" y="235" class="stereo">&lt;&lt;Laravel pamatkomponente&gt;&gt;</text>
    <text x="1012" y="264" text-anchor="middle" class="heading">Model</text>
    <text x="1012" y="283" text-anchor="middle" class="tiny">Eloquent modeļu pamatklase</text>
  </g>
  <g>
    <rect x="1280" y="210" width="230" height="80" rx="7" class="framework"/>
    <ellipse cx="1395" cy="232" rx="80" ry="11" fill="#e8edf3" stroke="#72859a" stroke-width="1.4"/>
    <path d="M1315 232 V264 C1315 279 1475 279 1475 264 V232" fill="#f0f3f7" stroke="#72859a" stroke-width="1.4"/>
    <ellipse cx="1395" cy="264" rx="80" ry="11" fill="#f0f3f7" stroke="#72859a" stroke-width="1.4"/>
    <text x="1395" y="252" text-anchor="middle" class="subheading">Datubāze</text>
    <text x="1395" y="274" text-anchor="middle" class="tiny">SQLite / MySQL</text>
  </g>

  <!-- Routes component. -->
  <g>
    <rect x="470" y="105" width="350" height="70" rx="7" class="component"/>
    <rect x="485" y="119" width="17" height="13" fill="#e5ebf2" stroke="#72859a"/>
    <path d="M485 135 H502 M485 139 H502" stroke="#72859a"/>
    <text x="512" y="130" class="stereo">&lt;&lt;komponente&gt;&gt;</text>
    <text x="645" y="155" text-anchor="middle" class="heading">Laravel maršruti</text>
    <text x="645" y="171" text-anchor="middle" class="tiny">routes/web.php · lasīšanas URL · GET / POST / PATCH / DELETE</text>
  </g>

  <!-- Domain model components. -->
  <g>
    <rect x="125" y="380" width="260" height="100" rx="7" class="component"/>
    <rect x="140" y="394" width="17" height="13" fill="#e5ebf2" stroke="#72859a"/>
    <path d="M140 410 H157 M140 414 H157" stroke="#72859a"/>
    <text x="167" y="405" class="stereo">&lt;&lt;komponente&gt;&gt;</text>
    <text x="255" y="436" text-anchor="middle" class="heading">User</text>
    <text x="255" y="459" text-anchor="middle" class="small">lietotāja konts un īpašnieks</text>
    <text x="255" y="476" text-anchor="middle" class="tiny">manto Authenticatable</text>
  </g>
  <g>
    <rect x="495" y="380" width="260" height="100" rx="7" class="component"/>
    <rect x="510" y="394" width="17" height="13" fill="#e5ebf2" stroke="#72859a"/>
    <path d="M510 410 H527 M510 414 H527" stroke="#72859a"/>
    <text x="537" y="405" class="stereo">&lt;&lt;komponente&gt;&gt;</text>
    <text x="625" y="436" text-anchor="middle" class="heading">ReadingChallenge</text>
    <text x="625" y="459" text-anchor="middle" class="small">izaicinājumi un to mērķi</text>
    <text x="625" y="476" text-anchor="middle" class="tiny">manto Model</text>
  </g>
  <g>
    <rect x="870" y="380" width="280" height="100" rx="7" class="component"/>
    <rect x="885" y="394" width="17" height="13" fill="#e5ebf2" stroke="#72859a"/>
    <path d="M885 410 H902 M885 414 H902" stroke="#72859a"/>
    <text x="912" y="405" class="stereo">&lt;&lt;komponente&gt;&gt;</text>
    <text x="1010" y="436" text-anchor="middle" class="heading">ReadingProgress</text>
    <text x="1010" y="459" text-anchor="middle" class="small">grāmatas lasīšanas progress</text>
    <text x="1010" y="476" text-anchor="middle" class="tiny">manto Model</text>
  </g>
  <g>
    <rect x="1265" y="380" width="260" height="100" rx="7" class="component"/>
    <rect x="1280" y="394" width="17" height="13" fill="#e5ebf2" stroke="#72859a"/>
    <path d="M1280 410 H1297 M1280 414 H1297" stroke="#72859a"/>
    <text x="1307" y="405" class="stereo">&lt;&lt;komponente&gt;&gt;</text>
    <text x="1395" y="436" text-anchor="middle" class="subheading">ReadingChallengeSession</text>
    <text x="1395" y="459" text-anchor="middle" class="small">taimera sesijas dati</text>
    <text x="1395" y="476" text-anchor="middle" class="tiny">manto Model</text>
  </g>

  <text x="125" y="330" class="small">Mantošana: User → Authenticatable; lasīšanas modeļi → Model. Asociāciju līnijas pie modeļiem rāda user_id un challenge_id saites.</text>

  <!-- Controller components. -->
  <g>
    <rect x="270" y="540" width="520" height="160" rx="7" class="component"/>
    <rect x="286" y="555" width="17" height="13" fill="#eee9f7" stroke="#7053a3"/>
    <path d="M286 571 H303 M286 575 H303" stroke="#7053a3"/>
    <text x="313" y="566" class="stereo">&lt;&lt;komponente&gt;&gt;</text>
    <text x="530" y="598" text-anchor="middle" class="heading">ReadingChallengeController</text>
    <line x1="270" y1="611" x2="790" y2="611" class="sep"/>
    <text x="292" y="638" class="body">Izmanto User autentificētā lietotāja noteikšanai un ReadingChallenge darbībām</text>
    <text x="292" y="661" class="body">Izmanto ReadingChallengeSession taimera sesiju sākšanai un vadīšanai</text>
    <text x="292" y="684" class="tiny">URL: /reading-challenges un /reading-timer · atbildes: Blade skats, novirzīšana vai JSON.</text>
  </g>
  <g>
    <rect x="865" y="540" width="520" height="160" rx="7" class="component"/>
    <rect x="881" y="555" width="17" height="13" fill="#eee9f7" stroke="#7053a3"/>
    <path d="M881 571 H898 M881 575 H898" stroke="#7053a3"/>
    <text x="908" y="566" class="stereo">&lt;&lt;komponente&gt;&gt;</text>
    <text x="1125" y="598" text-anchor="middle" class="heading">ReadingProgressController</text>
    <line x1="865" y1="611" x2="1385" y2="611" class="sep"/>
    <text x="887" y="638" class="body">Izmanto User autentificētā lietotāja noteikšanai un ReadingProgress ierakstiem</text>
    <text x="887" y="661" class="body">Izmanto ReadingChallenge lapu mērķu un progresa atjaunošanai</text>
    <text x="887" y="684" class="tiny">URL: /reading-progress un /reading-shelf · atbildes: Blade skats vai novirzīšana.</text>
  </g>

  <text x="125" y="928" class="small">Katra pārtrauktā bulta atsevišķi savieno kontrolieri ar konkrēto Blade skatu, ko tas atgriež. Taimera darbības papildus atgriež JSON.</text>

  <!-- Individual views, grouped by owning controller as in the supplied example. -->
  <g>
    <rect x="55" y="790" width="250" height="115" rx="7" class="view"/>
    <rect x="70" y="804" width="17" height="13" fill="#e6f1ee" stroke="#668b81"/>
    <path d="M70 820 H87 M70 824 H87" stroke="#668b81"/>
    <text x="97" y="815" class="stereo">&lt;&lt;skats&gt;&gt;</text>
    <text x="180" y="849" text-anchor="middle" class="subheading">Izaicinājumu saraksts</text>
    <text x="180" y="874" text-anchor="middle" class="body">reading-challenges/index</text>
    <text x="180" y="894" text-anchor="middle" class="tiny">index.blade.php</text>
  </g>
  <g>
    <rect x="310" y="790" width="250" height="115" rx="7" class="view"/>
    <rect x="325" y="804" width="17" height="13" fill="#e6f1ee" stroke="#668b81"/>
    <path d="M325 820 H342 M325 824 H342" stroke="#668b81"/>
    <text x="352" y="815" class="stereo">&lt;&lt;skats&gt;&gt;</text>
    <text x="435" y="849" text-anchor="middle" class="subheading">Izaicinājuma labošana</text>
    <text x="435" y="874" text-anchor="middle" class="body">reading-challenges/edit</text>
    <text x="435" y="894" text-anchor="middle" class="tiny">edit.blade.php</text>
  </g>
  <g>
    <rect x="565" y="790" width="250" height="115" rx="7" class="view"/>
    <rect x="580" y="804" width="17" height="13" fill="#e6f1ee" stroke="#668b81"/>
    <path d="M580 820 H597 M580 824 H597" stroke="#668b81"/>
    <text x="607" y="815" class="stereo">&lt;&lt;skats&gt;&gt;</text>
    <text x="690" y="849" text-anchor="middle" class="subheading">Izaicinājumu rezultāti</text>
    <text x="690" y="874" text-anchor="middle" class="body">reading-challenges/results</text>
    <text x="690" y="894" text-anchor="middle" class="tiny">results.blade.php</text>
  </g>
  <g>
    <rect x="820" y="790" width="250" height="115" rx="7" class="view"/>
    <rect x="835" y="804" width="17" height="13" fill="#e6f1ee" stroke="#668b81"/>
    <path d="M835 820 H852 M835 824 H852" stroke="#668b81"/>
    <text x="862" y="815" class="stereo">&lt;&lt;skats&gt;&gt;</text>
    <text x="945" y="849" text-anchor="middle" class="subheading">Lasīšanas taimeris</text>
    <text x="945" y="874" text-anchor="middle" class="body">reading-timer/index</text>
    <text x="945" y="894" text-anchor="middle" class="tiny">index.blade.php</text>
  </g>
  <g>
    <rect x="1075" y="790" width="250" height="115" rx="7" class="view"/>
    <rect x="1090" y="804" width="17" height="13" fill="#e6f1ee" stroke="#668b81"/>
    <path d="M1090 820 H1107 M1090 824 H1107" stroke="#668b81"/>
    <text x="1117" y="815" class="stereo">&lt;&lt;skats&gt;&gt;</text>
    <text x="1200" y="849" text-anchor="middle" class="subheading">Progresa izsekošana</text>
    <text x="1200" y="874" text-anchor="middle" class="body">reading-progress/index</text>
    <text x="1200" y="894" text-anchor="middle" class="tiny">index.blade.php</text>
  </g>
  <g>
    <rect x="1330" y="790" width="250" height="115" rx="7" class="view"/>
    <rect x="1345" y="804" width="17" height="13" fill="#e6f1ee" stroke="#668b81"/>
    <path d="M1345 820 H1362 M1345 824 H1362" stroke="#668b81"/>
    <text x="1372" y="815" class="stereo">&lt;&lt;skats&gt;&gt;</text>
    <text x="1455" y="849" text-anchor="middle" class="subheading">Grāmatu plaukts</text>
    <text x="1455" y="874" text-anchor="middle" class="body">reading-progress/shelf</text>
    <text x="1455" y="894" text-anchor="middle" class="tiny">shelf.blade.php</text>
  </g>

  <!-- View-rendering note and legend. -->
  <g transform="translate(80 980)">
    <text x="0" y="0" class="subheading">Diagrammas apzīmējumi</text>
    <path d="M0 30 H74" class="association" marker-end="url(#gen)"/>
    <text x="94" y="35" class="small">mantošana ar tukšu trijstūri</text>
    <path d="M360 30 H434" class="association"/>
    <text x="454" y="35" class="small">asociācija starp modeļiem</text>
    <path d="M710 30 H784" class="dependency" marker-end="url(#dep)"/>
    <text x="804" y="35" class="small">atkarība jeb komponentes izmantošana</text>
    <rect x="1160" y="16" width="18" height="13" fill="#e5ebf2" stroke="#72859a"/>
    <path d="M1160 32 H1178 M1160 36 H1178" stroke="#72859a"/>
    <text x="1190" y="35" class="small">UML komponentes simbols</text>
  </g>
  <rect x="80" y="1045" width="1440" height="205" rx="8" fill="#fff" stroke="#b7c3d0" stroke-width="1.5"/>
  <text x="105" y="1080" class="subheading">Visas lasīšanas modeļu datu attiecības</text>
  <text x="105" y="1110" class="body">User (1) ── (0..*) ReadingChallenge, ReadingProgress un ReadingChallengeSession. Katrs no šiem ierakstiem pieder vienam lietotājam.</text>
  <text x="105" y="1140" class="body">ReadingChallenge (1) ── (0..*) ReadingProgress un ReadingChallengeSession; katra ieraksta challenge_id saite var būt 0..1.</text>
  <text x="105" y="1170" class="body">ReadingChallengeController izmanto User, ReadingChallenge un ReadingChallengeSession; ReadingProgressController izmanto User, ReadingProgress un ReadingChallenge.</text>
  <text x="105" y="1200" class="body">Visi četri datu modeļi glabā un nolasa savus ierakstus datubāzē; Laravel Model nodrošina Eloquent pamatu modeļu darbam.</text>
  <text x="80" y="1285" class="small">Diagramma rāda Bookish lasīšanas moduli: maršrutu, kontrolieru, skatu un datu slāni. Pārējie lietotnes moduļi, piemēram, grāmatu apmaiņa un administrēšana, šeit nav iekļauti.</text>
</svg>
